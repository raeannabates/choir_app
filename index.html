<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Collections</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #b66d4b 0%, #be9f45 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background color: #f2efe9;
            border-radius: 15px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #404042;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #404042;
            margin-bottom: 50px;
            font-size: 16px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .option-card {
            padding: 40px 30px;
            background: linear-gradient(135deg, #b66d4b 0%, #d9c5b2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .option-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
        }

        .card-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .option-card h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .option-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Choir Book</h1>
        <p class="subtitle">Select a category to explore</p>
        
        <div class="options">
            <a href="schoir.html" class="option-card">
                <div class="card-icon">🎵</div>
                <h2>Schoir</h2>
                <p>Popular Schoir songs and lyrics.</p>
            </a>
            
            <a href="songalong.html" class="option-card">
                <div class="card-icon">🎤</div>
                <h2>SongAlong</h2>
                <p>Original songs by local musicians</p>
            </a>
        </div>
    </div>
</body>
</html>
