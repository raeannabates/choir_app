<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoir - Song Collection</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.4.6/dist/fuse.basic.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            padding-top: 200px;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px 0;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .back-button {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 15px;
            transition: background 0.3s;
            font-size: 14px;
        }

        .back-button:hover {
            background: #764ba2;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        #search-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        #song-list-container {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-top: 20px;
        }

        #song-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #song-list li {
            padding: 0;
            border-bottom: 1px solid #eee;
        }

        #song-list li:last-child {
            border-bottom: none;
        }

        #song-list li a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: #333;
            transition: background 0.3s;
        }

        #song-list li a:hover {
            background: #f9f9f9;
            color: #667eea;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <a href="index.html" class="back-button">← Back to Categories</a>
            <h1>🎵 Schoir Songs</h1>
            <input type="text" id="search-box" placeholder="Search for songs or artists...">
        </div>
    </div>

    <div class="container">
        <div id="song-list-container">
            <ul id="song-list"></ul>
        </div>
    </div>

    <script>
        let fuse;

        document.addEventListener('DOMContentLoaded', function() {
            fetchSongs();
        });

        async function fetchSongs() {
            const apiKey = 'AIzaSyB_ShIZ__WL6phV8QzBk67WjbP7eJBfVWc'; // Google Sheets API key
            const sheetId = '1Ia64T3_EmbUSyWLsoV3Wsxnmoi0DuCTdvK0iwPr1LZ8'; // Replace with your Sheet ID
            const range = 'Schoir!A:B'; // Note: Changed to Schoir tab

            try {
                const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${apiKey}`);
                const data = await response.json();
                
                if (data.values) {
                    setupFuse(data.values.slice(1)); // Skip header row
                    displaySongs(data.values.slice(1));
                }
            } catch (error) {
                console.error('Error fetching songs:', error);
                document.getElementById('song-list').innerHTML = '<li class="no-results">Error loading songs. Please check your sheet ID.</li>';
            }
        }

        function setupFuse(songs) {
            const options = {
                includeScore: true,
                threshold: 0.5,
                distance: 1000,
                minMatchCharLength: 1,
                keys: ['0']
            };
            fuse = new Fuse(songs, options);
        }

        function displaySongs(songs) {
            const songList = document.getElementById('song-list');
            songList.innerHTML = '';
            
            if (songs.length === 0) {
                songList.innerHTML = '<li class="no-results">No songs found</li>';
                return;
            }

            songs.forEach(song => {
                if (song[0] && song[1]) { // Only add if both name and link exist
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.textContent = song[0];
                    a.href = song[1];
                    a.target = "_blank";
                    li.appendChild(a);
                    songList.appendChild(li);
                }
            });
        }

        document.getElementById('search-box').addEventListener('input', function() {
            const searchInput = this.value;
            const songList = document.getElementById('song-list');
            
            if (!searchInput.trim()) {
                // Re-fetch and display all songs if search is empty
                fetchSongs();
                return;
            }

            const results = fuse.search(searchInput);
            songList.innerHTML = '';
            
            if (results.length === 0) {
                songList.innerHTML = '<li class="no-results">No songs found matching your search</li>';
                return;
            }

            results.forEach(result => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.textContent = result.item[0];
                a.href = result.item[1];
                a.target = "_blank";
                li.appendChild(a);
                songList.appendChild(li);
            });
        });
    </script>
</body>
</html>
